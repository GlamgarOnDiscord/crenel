[package]
name = "crenel-desktop"
version = "0.1.0"
description = "Crenel desktop app: a window around the console served by the bundled crenel engine"
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
