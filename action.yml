# Crenel as a GitHub Action: scan, upload SARIF to code scanning, and fail the
# job only on a PROVEN finding at or above `fail-on`. Leads never fail a build.
#
#   permissions:
#     contents: read
#     security-events: write   # upload-sarif (code scanning)
#     pull-requests: write     # only with pr-comment: "true" and no GitHub App
#   steps:
#     - uses: actions/checkout@<sha>
#     - uses: <owner>/crenel@<sha>
#       with:
#         config: crenel.config.yaml
#         pr-comment: "true"
#
# Offline and read-only unless your config turns on active testing for hosts
# you declared. No account, no model. The only token used is the workflow's
# GITHUB_TOKEN, by GitHub's own upload-sarif action and, when pr-comment is on,
# for one comment on the pull request (docs/INTEGRATIONS.md).
name: Crenel scan
description: Defensive security harness for SaaS. Proven findings only, with a replayable proof each.
branding:
  icon: shield
  color: orange
inputs:
  config:
    description: Path to crenel.config.yaml
    default: crenel.config.yaml
  fail-on:
    description: Fail on a proven finding at or above this severity (critical, high, medium, low)
    default: high
  sarif:
    description: Where to write the SARIF report
    default: crenel.sarif
  upload-sarif:
    description: Upload the SARIF to GitHub code scanning (needs security-events write)
    default: "true"
  report:
    description: Where to write the JSON report (read by the PR comment)
    default: crenel.json
  pr-comment:
    description: On pull_request events, keep one comment summarising the proven findings (needs pull-requests write; skipped on forks, whose token is read-only)
    default: "false"
  app-client-id:
    description: Optional GitHub App client ID, so the PR comment is posted as <app-name>[bot] with the app's logo (docs/INTEGRATIONS.md). Without it, GITHUB_TOKEN posts as github-actions[bot]
    default: ""
  app-id:
    description: Legacy GitHub App ID, used when app-client-id is empty (create-github-app-token prefers the client ID)
    default: ""
  app-private-key:
    description: The GitHub App's private key, from a secret (secrets.CRENEL_APP_PRIVATE_KEY)
    default: ""
  check-run:
    description: With a GitHub App that has "Checks read and write", add a "Crenel" check run (app name and logo, summary, line annotations) to the commit
    default: "true"
  locale:
    description: Language of the PR comment when options.integrations.locale is auto (en, fr); empty means auto
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    # Build Crenel from the action's own checkout; never run install scripts.
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
    - id: scan
      shell: bash
      env:
        CRENEL_CONFIG: ${{ inputs.config }}
        CRENEL_SARIF: ${{ inputs.sarif }}
        CRENEL_FAIL_ON: ${{ inputs.fail-on }}
        CRENEL_REPORT: ${{ inputs.report }}
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" scan --config "$CRENEL_CONFIG" --sarif "$CRENEL_SARIF" --out "$CRENEL_REPORT" --fail-on "$CRENEL_FAIL_ON"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
    - if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: crenel
    # Optional GitHub App: an installation token limited to this repository,
    # pull requests write and contents read. It expires with the job.
    - id: app-token
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && inputs.app-private-key != '' && (inputs.app-client-id != '' || inputs.app-id != '') }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id || inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-pull-requests: write
        permission-contents: read
    # Never fails the job: a read-only token or an API error is a warning.
    - if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        CRENEL_COMMENT_AUTHOR: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
        CRENEL_LOCALE: ${{ inputs.locale }}
        CRENEL_CONFIG: ${{ inputs.config }}
        CRENEL_REPORT: ${{ inputs.report }}
      run: node "$GITHUB_ACTION_PATH/dist/cli.js" github-comment --report "$CRENEL_REPORT" --config "$CRENEL_CONFIG"
    # Check run under the app's name and logo. A separate token, because the
    # app may not have accepted the Checks permission yet: then this step only
    # warns and the PR comment above is unaffected.
    - id: check-token
      if: ${{ always() && inputs.check-run == 'true' && inputs.app-private-key != '' && (inputs.app-client-id != '' || inputs.app-id != '') }}
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id || inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-checks: write
    - if: ${{ always() && steps.check-token.outputs.token != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.check-token.outputs.token }}
        CRENEL_LOCALE: ${{ inputs.locale }}
        CRENEL_CONFIG: ${{ inputs.config }}
        CRENEL_REPORT: ${{ inputs.report }}
        CRENEL_FAIL_ON: ${{ inputs.fail-on }}
      run: node "$GITHUB_ACTION_PATH/dist/cli.js" github-check --report "$CRENEL_REPORT" --config "$CRENEL_CONFIG" --fail-on "$CRENEL_FAIL_ON"
    - if: ${{ always() && inputs.check-run == 'true' && inputs.app-private-key != '' && steps.check-token.outputs.token == '' }}
      shell: bash
      run: echo "::warning::Crenel check run skipped: the GitHub App has no Checks permission yet (Repository permissions, Checks, Read and write, then accept it on the installation)"
    - shell: bash
      env:
        CRENEL_EXIT: ${{ steps.scan.outputs.exit }}
      run: exit "${CRENEL_EXIT:-2}"
