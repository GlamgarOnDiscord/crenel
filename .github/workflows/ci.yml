name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Crenel must run natively on Windows (no WSL): same suite on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # Bastion's own lesson: never run dependency install scripts in CI.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bench
      - run: pnpm build
      # Ground truth is part of merge governance: every known flaw must be found,
      # every decoy preserved, and replayed exploration is reported separately.
      - run: pnpm benchmark -- --seed ci-${{ github.sha }} --json benchmark-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-${{ runner.os }}-${{ github.sha }}
          path: benchmark-result.json
      # The web console: its own install, tests (SSR smoke + data layer) and build.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      # Dogfood: scan the bundled example. It exits non-zero on purpose
      # (the example ships planted secrets), so we only assert it runs.
      - run: pnpm crenel scan --config examples/crenel.config.yaml || true
        shell: bash
