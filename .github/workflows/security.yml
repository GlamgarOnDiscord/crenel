# Example: run Crenel in CI and upload its findings to GitHub code scanning.
# Copy this into a consumer project (adjust the config path). Here it scans the
# bundled example so the workflow is runnable as-is.
name: security

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, also refreshes the malware denylist

permissions:
  contents: read
  security-events: write # required to upload SARIF
  actions: read # upload-sarif reads the workflow run (required on private repositories)

jobs:
  crenel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      # Refresh the malware denylist from OSV (read-only, public data).
      - run: pnpm sync-denylist || true
      # Scan and emit SARIF. Does not fail the job here; gate on a baseline in
      # a real project with: node dist/cli.js scan --baseline crenel-baseline.json
      - run: node dist/cli.js scan --config examples/crenel.config.yaml --sarif crenel.sarif || true
      # Check the file before GitHub sees it: OASIS SARIF 2.1.0 schema and
      # GitHub's documented code scanning requirements (docs/INTEGRATIONS.md).
      - run: npx tsx scripts/validate-sarif.ts crenel.sarif
      # Always inspectable, even where code scanning is not available.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crenel-sarif
          path: crenel.sarif
          if-no-files-found: error
          retention-days: 14
      # Code scanning exists on public repositories, and on private ones only
      # with GitHub Code Security. This repository is private without it, so
      # the upload is allowed to fail here; drop continue-on-error in yours.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        continue-on-error: true
        with:
          sarif_file: crenel.sarif
          category: crenel
