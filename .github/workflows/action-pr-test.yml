# Throwaway: exercises action.yml (pr-comment) on this pull request. Not merged.
name: action pr-comment test
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  crenel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The example ships planted secrets, so the scan step exits 1 on purpose.
      - uses: ./
        continue-on-error: true
        with:
          config: examples/crenel.config.yaml
          upload-sarif: "false"
          pr-comment: "true"
      - run: test -s crenel.json && test -s crenel.sarif && cat examples/.crenel/audit.jsonl
